name: Build template

on:
  workflow_call:
    inputs:
      method:
        description: "Method to test"
        required: true
        type: string

env:
  DOCKER_BUILDKIT: 0

jobs:
  build_template_x86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Build Docker image
        run: docker build -t cp3-bench . --build-arg METHODS=${{ inputs.method }} --platform linux/amd64,linux/arm64

      - name: Run tests
        uses: addnab/docker-run-action@v3
        with:
          image: cp3-bench
          run: python3 -m unittest tests/utils/test_build.py
